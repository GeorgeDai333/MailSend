# Render Blueprint. In the Render dashboard: New → Blueprint → point at this repo.
# Everything below is created for you except the two Google secrets, which
# Render will prompt for on first deploy.

# No `databases:` block on purpose. Render's free Postgres expires 30 days
# after creation and only one can be active per workspace, so the database
# lives on Neon instead (permanent free tier). Set DATABASE_URL in the Render
# dashboard to the Neon connection string — it is a secret and must never be
# committed here.

services:
  - type: web
    name: mailsend
    runtime: python
    plan: free
    # The public URL is https://<name>.onrender.com and it stays fixed as long
    # as this service name does not change — which is what lets the Google
    # OAuth redirect URI stay constant.
    buildCommand: "./build.sh"
    startCommand: "gunicorn mailsend.wsgi:application --workers 2 --timeout 120"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TIME_ZONE
        value: America/Chicago
      - key: WEB_CONCURRENCY
        value: "2"
      # Paste the Neon connection string here in the Render dashboard.
      # Keep the ?sslmode=require suffix — Neon rejects unencrypted connections.
      - key: DATABASE_URL
        sync: false
      # Prompted on first deploy — from the Google Cloud console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match the Authorised redirect URI in Google Cloud.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional: comma-separated list restricting who may sign up.
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false

  # OPTIONAL — the automatic scheduler.
  #
  # Everything above runs on Render's free tier. Cron jobs do NOT have a free
  # tier, so this block is commented out to keep the blueprint free to deploy.
  # Without it the app works fully; the executive just sends by clicking, and
  # the "send automatically once the send date passes" checkbox has no effect.
  #
  # Uncomment to enable unattended scheduled sending (billed by Render).
